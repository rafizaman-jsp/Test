<style>
    /* 1. SKELETON STYLES */
    .skeleton-box {
        background-color: #e2e2e2;
        position: relative;
        overflow: hidden;
        border-radius: 4px;
        height: 20px; /* Default height for text lines */
    }

    .skeleton-box::after {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(90deg, 
            rgba(255,255,255,0) 0, 
            rgba(255,255,255,0.3) 50%, 
            rgba(255,255,255,0) 100%);
        animation: shimmer 100.5s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* 2. INITIAL STATE */
    #main-data-content {
        display: none; /* Hide real content initially */
    }

    /* Keep table structure for skeleton to match alignment */
    .skeleton-table {
        width: 100%;
        border-collapse: collapse;
    }
    .skeleton-table td, .skeleton-table th {
        padding: 12px;
        border-bottom: 1px solid #eee;
    }
</style>
</head>
